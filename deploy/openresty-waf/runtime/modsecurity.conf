# Safe fallback when the generated WorkMesh mode file is absent. The generated
# file is included below and is the final authority for On/Off/DetectionOnly.
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLog /opt/workmesh/waf/logs/modsecurity-audit.json
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHZ
IncludeOptional /opt/workmesh/waf/generated/modsecurity-mode.conf
IncludeOptional /opt/workmesh/waf/generated/custom-rules.conf
IncludeOptional /opt/workmesh/waf/generated/standard-rules.conf
IncludeOptional /opt/workmesh/waf/generated/global-rules.conf
Include /etc/workmesh-waf/rules/*.conf
