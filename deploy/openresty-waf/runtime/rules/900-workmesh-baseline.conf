# WorkMesh 补充规则：用于镜像未联网或 CRS 规则尚未更新时的最小保护集。
SecRule ARGS|REQUEST_URI "@rx (?i)(union.{0,64}select|select.{0,64}from|(?:or|and).{0,16}\d+.{0,8}=.{0,8}\d+)" "id:100100,phase:1,deny,status:403,log,msg:'WorkMesh SQL injection baseline'"
SecRule ARGS|REQUEST_URI "@rx (?i)(<.{0,8}script\b|%3c.{0,16}script|javascript.{0,8}:|on(?:error|load|click).{0,8}=)" "id:100101,phase:1,deny,status:403,log,msg:'WorkMesh XSS baseline'"
SecRule ARGS|REQUEST_URI "@rx (?i)(?:\.\./){2,}|(?:%2e){2}(?:%2f|/)|/etc/passwd|boot\.ini" "id:100102,phase:1,deny,status:403,log,msg:'WorkMesh path traversal baseline'"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)\b(?:sqlmap|nikto|nmap|masscan)\b" "id:100103,phase:1,deny,status:403,log,msg:'WorkMesh scanner baseline'"
SecRule REQUEST_METHOD "@streq TRACE" "id:100104,phase:1,deny,status:403,log,msg:'WorkMesh TRACE method baseline'"
SecRule ARGS|REQUEST_URI "@rx (?i)(?:;|\||&&|%3b|%7c|%26%26).{0,16}(?:cat|id|whoami|uname|curl|wget)\b|\$\([^)]{1,128}\)" "id:100105,phase:1,deny,status:403,log,msg:'WorkMesh command injection baseline'"
SecRule ARGS|REQUEST_URI "@rx (?i)(?:<\?php|php://|(?:eval|assert)\s*\()" "id:100106,phase:1,deny,status:403,log,msg:'WorkMesh PHP injection baseline'"
SecRule REQUEST_BODY "@rx (?i)(<.{0,8}script\b|javascript.{0,8}:|on(?:error|load|click).{0,8}=)" "id:100107,phase:2,deny,status:403,log,msg:'WorkMesh XSS body baseline'"
SecRule REQUEST_BODY "@rx (?i)(?:;|\||&&).{0,16}(?:cat|id|whoami|uname|curl|wget)\b|\$\([^)]{1,128}\)" "id:100108,phase:2,deny,status:403,log,msg:'WorkMesh command body baseline'"
SecRule REQUEST_BODY "@rx (?i)(?:<\?php|php://|(?:eval|assert)\s*\()" "id:100109,phase:2,deny,status:403,log,msg:'WorkMesh PHP body baseline'"
