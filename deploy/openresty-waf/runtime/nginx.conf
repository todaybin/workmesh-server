load_module /usr/lib/ngx_http_modsecurity_module.so;
worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /var/run/openresty.pid;

events { worker_connections 4096; }

http {
    lua_shared_dict workmesh_waf 16m;
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    access_by_lua_file /usr/local/openresty/lualib/workmesh_waf/access.lua;
    log_by_lua_file /usr/local/openresty/lualib/workmesh_waf/log.lua;
    include       mime.types;
    default_type  application/octet-stream;
    # Keep the combined access log beside ModSecurity and WorkMesh audit
    # records so the server can query one mounted WAF log root.
    access_log    /opt/workmesh/waf/logs/access.log;
    sendfile      on;
    keepalive_timeout 65;
    modsecurity on;
    modsecurity_rules_file /etc/workmesh-waf/modsecurity.conf;
    include /usr/local/openresty/nginx/conf/default/*.conf;
    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
    include /www/wwwroot/*/nginx/site.conf;
}

stream {
    include /usr/local/openresty/nginx/conf/stream.d/*.conf;
    include /www/wwwroot/*/nginx/stream.conf;
}
